{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Bank Management System | Login</title>

    <link rel="stylesheet"
          href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">

    <link rel="stylesheet"
          href="https://fonts.googleapis.com/icon?family=Material+Icons">

    <link rel="stylesheet"
          href="{% static 'css/style.css' %}">

    <style>

        body{

            background:#f4f7fb;

            font-family:'Varela Round',sans-serif;

        }

        .login-box{

            width:430px;

            margin:80px auto;

        }

        .panel{

            border:none;

            border-radius:10px;

            box-shadow:0 5px 20px rgba(0,0,0,.15);

        }

        .panel-heading{

            background:#435d7d !important;

            color:#fff !important;

            text-align:center;

            padding:20px;

            border-radius:10px 10px 0 0;

        }

        .panel-heading h2{

            margin:0;

            font-size:28px;

            font-weight:600;

        }

        .panel-body{

            padding:30px;

        }

        .form-group{

            margin-bottom:20px;

        }

        label{

            color:#435d7d;

            font-weight:600;

        }

        .form-control{

            height:45px;

            border-radius:5px;

            border:1px solid #ced4da;

        }

        .form-control:focus{

            border-color:#435d7d;

            box-shadow:0 0 8px rgba(67,93,125,.25);

        }

        .btn-login{

            width:100%;

            height:45px;

            background:#28a745;

            border:none;

            color:#fff;

            font-size:16px;

            border-radius:5px;

        }

        .btn-login:hover{

            background:#218838;

            color:#fff;

        }

        .bank-icon{

            font-size:60px;

            margin-bottom:10px;

        }

        .footer{

            text-align:center;

            margin-top:20px;

            color:#888;

        }

    </style>

</head>

<body>

<div class="login-box">

    {% if messages %}

        {% for message in messages %}

            <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}success{% endif %}">

                {{ message }}

            </div>

        {% endfor %}

    {% endif %}

    <div class="panel panel-default">

        <div class="panel-heading">

            <span class="material-icons bank-icon">

                account_balance

            </span>

            <h2>Bank Management System</h2>

            <p>Administrator Login</p>

        </div>

        <div class="panel-body">

            <form method="POST">

                {% csrf_token %}

                <div class="form-group">

                    <label>

                        Username

                    </label>

                    <input
                        type="text"
                        name="username"
                        class="form-control"
                        placeholder="Enter Username"
                        required>

                </div>

                <div class="form-group">

                    <label>

                        Password

                    </label>

                    <input
                        type="password"
                        name="password"
                        class="form-control"
                        placeholder="Enter Password"
                        required>

                </div>

                <button
                    type="submit"
                    class="btn btn-login">

                    <i class="material-icons">

                        login

                    </i>

                    Login

                </button>

            </form>

        </div>

    </div>

    <div class="footer">

        © 2026 Bank Management System

    </div>

</div>

</body>

</html>
